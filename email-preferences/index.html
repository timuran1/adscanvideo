<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Email preferences | AdScanVideo</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#1a1a2e;font:16px/1.6 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);background:white;border-radius:12px;padding:32px}a{color:#194dbd}h1{font-size:1.6rem;line-height:1.2;letter-spacing:-.02em;margin:24px 0 16px}p{color:#45516c}button,.continue{display:block;width:100%;padding:13px 18px;min-height:48px;border:0;border-radius:8px;background:#245edb;color:white;font:600 .95rem system-ui;cursor:pointer;text-align:center;text-decoration:none;margin:24px 0 12px}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #245edb;outline-offset:3px}[hidden]{display:none!important}#notice{overflow-wrap:anywhere}small{color:#45516c} @media(max-width:480px){main{padding:24px}} </style></head><body><main><a href="/">AdScanVideo</a><h1>Email preferences</h1><p>Stop receiving AdScanVideo marketing tips. Requested sign in links and report emails are separate.</p><button id="unsubscribe" type="button">Unsubscribe from marketing emails</button><p id="notice" role="status" aria-live="polite"></p><a href="/">Return to AdScanVideo</a></main><script>const token=location.hash.slice(1);history.replaceState(null,'','/email-preferences/');const btn=document.getElementById('unsubscribe'),notice=document.getElementById('notice');if(!/^[A-Za-z0-9_-]{40,64}$/.test(token)){btn.hidden=true;notice.textContent='Open Email preferences from your signed in AdScanVideo account to get a valid link.';}btn.addEventListener('click',async()=>{btn.disabled=true;try{const r=await fetch('https://api.adscanvideo.com/api/email/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not update your preference.');notice.textContent=data.message;btn.hidden=true;}catch(e){notice.textContent=e.message;btn.disabled=false;}});</script></body></html>
